name: Verify LocalPay

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            examples/node-integration/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Prepare locked dependencies
        run: |
          uv python install 3.13
          uv sync --locked --project apps/api --python 3.13
          uv sync --locked --project packages/cli --python 3.13
          uv sync --locked --project examples/fastapi-integration --python 3.13
          npm ci --prefix apps/dashboard
          npm ci --prefix examples/node-integration
          npm exec --prefix apps/dashboard -- playwright install --with-deps chromium
      - name: Audit dependencies and Git history
        run: |
          uv export --locked --project apps/api --no-emit-project --no-header --no-annotate -o "$RUNNER_TEMP/api-requirements.txt" >/dev/null
          uv export --locked --project examples/fastapi-integration --no-emit-project --no-header --no-annotate -o "$RUNNER_TEMP/example-requirements.txt" >/dev/null
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/api-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/example-requirements.txt"
          npm audit --prefix apps/dashboard --audit-level=moderate
          npm audit --prefix examples/node-integration --audit-level=moderate
          docker run --rm --volume "$PWD:/source:ro" --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/source ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --log-opts=--all /source
      - name: Verify isolated stack
        run: bash scripts/ci.sh
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: localpay-verification
          path: .localpay-ci/
          include-hidden-files: true
          if-no-files-found: ignore
