[project]
name = "localpay-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["celery-types>=0.22", "httpx>=0.28,<1", "mypy>=1.14,<3", "pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL, Redis and a Celery worker"]

[tool.ruff]
target-version = "py312"
src = ["."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic", "tests"]
