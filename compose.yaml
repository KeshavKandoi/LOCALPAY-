x-app: &app
  image: localpay-api:dev
  pull_policy: never
  environment: &app-environment
    LOCALPAY_DATABASE_URL: postgresql+psycopg://localpay:${LOCALPAY_POSTGRES_PASSWORD:?Set LOCALPAY_POSTGRES_PASSWORD in .env}@postgres:5432/localpay
    LOCALPAY_REDIS_URL: redis://redis:6379/0
    LOCALPAY_CELERY_QUEUE: ${LOCALPAY_CELERY_QUEUE:-celery}
    LOCALPAY_WEBHOOK_ENCRYPTION_KEY: ${LOCALPAY_WEBHOOK_ENCRYPTION_KEY:-}
    LOCALPAY_VERIFICATION_TOKEN: ${LOCALPAY_VERIFICATION_TOKEN:-}
    LOCALPAY_WEBHOOK_TARGETS: ${LOCALPAY_WEBHOOK_TARGETS:-}

services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: localpay
      POSTGRES_PASSWORD: ${LOCALPAY_POSTGRES_PASSWORD:?Set LOCALPAY_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: localpay
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U localpay -d localpay"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.8-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      LOCALPAY_ADMIN_TOKEN: ${LOCALPAY_ADMIN_TOKEN:-}
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    ports:
      - "127.0.0.1:${LOCALPAY_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 12

  worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 10s
      timeout: 6s
      retries: 6

  reliability-worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=${LOCALPAY_CELERY_QUEUE:-celery}.reliability", "--hostname=reliability@%h"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect --timeout=3 --destination=reliability@$$HOSTNAME ping"]
      interval: 10s
      timeout: 6s
      retries: 6

  scheduler:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/localpay-beat"]
    depends_on:
      worker:
        condition: service_healthy

  dashboard:
    image: localpay-dashboard:dev
    pull_policy: never
    build:
      context: .
      dockerfile: infra/dashboard.Dockerfile
    environment:
      LOCALPAY_API_URL: http://api:8000
      LOCALPAY_ADMIN_TOKEN: ${LOCALPAY_ADMIN_TOKEN:-}
      LOCALPAY_DASHBOARD_SECURE_COOKIE: ${LOCALPAY_DASHBOARD_SECURE_COOKIE:-false}
    ports:
      - "127.0.0.1:${LOCALPAY_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12

  verify:
    <<: *app
    profiles: ["test"]
    image: localpay-api-test:dev
    build:
      context: .
      dockerfile: infra/api.Dockerfile
      target: test
    environment:
      <<: *app-environment
      LOCALPAY_RUN_INTEGRATION: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    depends_on:
      worker:
        condition: service_healthy

volumes:
  pgdata:
